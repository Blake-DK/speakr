# Publishes this fork's images to GHCR when a studio release is tagged
# (v<upstream version>-studio.<n>, for example v0.11.0-studio.1):
#
#   ghcr.io/<owner>/speakr-studio        the app: upstream's lite image built from
#                                        this repository + Dockerfile.studio
#   ghcr.io/<owner>/speakr-whisper-arc   the Intel Arc transcription service (whisper/)
#
# GitHub-hosted runners only. Never point a job of this public repository at a
# self-hosted runner: a pull request could then run code on that machine.

name: Studio images

on:
  push:
    tags:
      - 'v*-studio.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image names and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="sha-${GITHUB_SHA::7}"; fi
          echo "image=ghcr.io/${owner}/speakr-studio" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build upstream's lite image from this repository
        run: docker build --build-arg PRODUCTION=1 --build-arg LIGHTWEIGHT=1 -t speakr-base:lite .

      - name: Build the studio image on top
        run: |
          docker build -f Dockerfile.studio --build-arg BASE_IMAGE=speakr-base:lite \
            --build-arg STUDIO_RELEASE=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.version=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            -t speakr-studio:ci .

      - name: Smoke test (the image starts, the login page and the studio health route answer)
        run: |
          python3 tests/e2e/smoke_env.py > smoke.env
          docker run -d --name studio-smoke -p 8899:8899 --env-file smoke.env speakr-studio:ci
          for i in $(seq 1 90); do curl -fs -o /dev/null http://127.0.0.1:8899/login && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:8899/login
          test "$(curl -fs http://127.0.0.1:8899/api/studio/health)" = '{"status":"ok"}'
          curl -fs http://127.0.0.1:8899/login | grep -q '<title>[^<]* - ScriptBot</title>'
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8899/studio)"
          test "$code" = "302"

      - name: Container log
        if: always()
        run: docker logs studio-smoke 2>&1 | tail -n 200 || true

      # Upstream's test workflow runs tests/studio without the add-on's own
      # packages (requirements-studio.txt), so the slide deck tests skip there.
      # Here they run inside the image, where python-pptx is installed.
      - name: Studio tests inside the image
        run: |
          docker run --rm -v "$PWD":/repo -w /repo -e PYTHONDONTWRITEBYTECODE=1 --entrypoint sh speakr-studio:ci -c \
            'pip install -q --disable-pip-version-check pytest==9.2.0 && python -c "import pptx" && python -m pytest tests/studio -q -p no:cacheprovider -rs'

      # What the image serves: the name ScriptBot, no Speakr, no link to GitHub but
      # the licence's (src/studio/rebrand.py). Run in /app, against the app's files as
      # the build rewrote them, not the checkout's; tests/ is mounted there.
      - name: Served text says ScriptBot (inside the image)
        run: |
          docker run --rm -v "$PWD/tests":/app/tests:ro -w /app -e PYTHONDONTWRITEBYTECODE=1 -e STUDIO_SERVED_CHECK=1 \
            --entrypoint sh speakr-studio:ci -c \
            'pip install -q --disable-pip-version-check pytest==9.2.0 && python -m pytest tests/studio/test_served_name.py tests/studio/test_asset_version.py -q -p no:cacheprovider -rs'

      # The app runs as a user without a writable home. A PDF rendered that way
      # must find the image's font cache valid and print nothing; a stale cache
      # makes fontconfig log an error on every PDF. Checked on the built image,
      # as it is shipped (a check during the build cannot see it).
      - name: PDF as a user without a home
        run: |
          out="$(docker run --rm -u 911:911 -e HOME=/ --entrypoint python speakr-studio:ci \
            -c 'import weasyprint; weasyprint.HTML(string="<p>ok</p>").write_pdf()' 2>&1)"
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          docker tag speakr-studio:ci "${image}:${version}"
          docker push "${image}:${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag speakr-studio:ci "${image}:latest"
            docker push "${image}:latest"
          fi

  whisper-arc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image names and tags
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="sha-${GITHUB_SHA::7}"; fi
          echo "image=ghcr.io/${owner}/speakr-whisper-arc" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build -f whisper/Dockerfile.arc \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ steps.meta.outputs.version }} \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            -t speakr-whisper-arc:ci whisper

      - name: Test the OpenAI-compatible route (no GPU, a fake engine)
        run: docker run --rm -v "$PWD/whisper":/w:ro -w /w speakr-whisper-arc:ci python3 tests/test_openai_compat.py

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          docker tag speakr-whisper-arc:ci "${image}:${version}"
          docker push "${image}:${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag speakr-whisper-arc:ci "${image}:latest"
            docker push "${image}:latest"
          fi
